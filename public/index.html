<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>AI Chat</title></head>
<body style="background:#0f111a; color:white; font-family:sans-serif;">
    <div id="box" style="height:80vh; overflow-y:auto; padding:20px;"></div>
    <div style="display:flex; padding:20px;">
        <input id="in" style="flex:1; padding:10px;">
        <button onclick="send()">Отправить</button>
    </div>
    <script>
        async function send() {
            const i = document.getElementById('in');
            const b = document.getElementById('box');
            const val = i.value; i.value = '';
            b.innerHTML += `<div><b>Вы:</b> ${val}</div>`;
            const res = await fetch('/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ message: val })
            });
            const d = await res.json();
            b.innerHTML += `<div><b>ИИ:</b> ${d.choices[0].message.content}</div>`;
        }
    </script>
</body>
</html>
